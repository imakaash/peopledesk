<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" width="1800" height="1120" font-family="Bradley Hand, 'Segoe Print', 'Comic Sans MS', cursive" font-size="15" fill="#1e1e1e">
  <title>PeopleDesk architecture: harness, agent loop, memory and LLM Ops</title>
  <defs>
    <!-- slight wobble so lines look hand-drawn -->
    <filter id="sketch" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect width="1800" height="1120" fill="#ffffff"/>

  <!-- ============ shapes ============ -->
  <g filter="url(#sketch)" fill="none" stroke="#1e1e1e" stroke-width="1.8">
    <!-- containers -->
    <rect x="20" y="20" width="1185" height="1080" rx="22" stroke="#c92a2a" stroke-width="3.5"/>
    <rect x="45" y="255" width="1135" height="225" rx="22"/>
    <rect x="430" y="95" width="420" height="375" rx="22" stroke="#e8890c" stroke-width="3.5"/>
    <rect x="1230" y="265" width="550" height="660" rx="22" stroke="#1c5bb8" stroke-width="3.5"/>

    <!-- auth -->
    <rect x="60" y="140" width="345" height="80" rx="10"/>

    <!-- turn inputs -->
    <rect x="60" y="270" width="175" height="36" rx="6" fill="#b2f2bb"/>
    <rect x="60" y="318" width="175" height="36" rx="6"/>
    <rect x="60" y="366" width="175" height="36" rx="6"/>
    <rect x="60" y="414" width="175" height="50" rx="6"/>

    <!-- triage + working memory -->
    <rect x="258" y="268" width="152" height="100" rx="10"/>
    <rect x="258" y="388" width="152" height="60" rx="10"/>

    <!-- loop -->
    <rect x="585" y="108" width="252" height="132" rx="10"/>
    <ellipse cx="560" cy="372" rx="108" ry="52" fill="#ffc9c9"/>

    <!-- right of loop -->
    <rect x="872" y="268" width="160" height="62" rx="10"/>
    <rect x="872" y="352" width="160" height="70" rx="10"/>
    <rect x="1052" y="355" width="112" height="50" rx="8" fill="#b2f2bb"/>

    <!-- memory stores -->
    <rect x="55" y="570" width="205" height="125" rx="14"/>
    <rect x="280" y="570" width="215" height="125" rx="14"/>
    <rect x="515" y="570" width="200" height="125" rx="14"/>
    <rect x="735" y="570" width="235" height="125" rx="14"/>

    <!-- databases -->
    <g fill="#e9ecef">
      <path d="M430,770 v80 a42,12 0 0 0 84,0 v-80"/>
      <ellipse cx="472" cy="770" rx="42" ry="12"/>
      <path d="M430,797 a42,12 0 0 0 84,0 M430,824 a42,12 0 0 0 84,0"/>
      <path d="M838,770 v80 a42,12 0 0 0 84,0 v-80"/>
      <ellipse cx="880" cy="770" rx="42" ry="12"/>
      <path d="M838,797 a42,12 0 0 0 84,0 M838,824 a42,12 0 0 0 84,0"/>
    </g>

    <!-- consolidation -->
    <path d="M880,890 L1040,940 L880,990 L720,940 Z"/>
    <ellipse cx="880" cy="1045" rx="125" ry="40" fill="#ffc9c9"/>

    <!-- llm ops -->
    <rect x="1255" y="345" width="200" height="90" rx="10"/>
    <rect x="1478" y="335" width="285" height="195" rx="16"/>
    <rect x="1493" y="348" width="255" height="80" rx="10"/>
    <rect x="1493" y="440" width="255" height="80" rx="10"/>
    <rect x="1493" y="558" width="255" height="65" rx="10"/>
    <path d="M1620,640 L1760,705 L1620,770 L1480,705 Z"/>
    <rect x="1493" y="810" width="255" height="95" rx="10"/>
  </g>

  <!-- ============ arrows ============ -->
  <g filter="url(#sketch)" fill="none" stroke="#1e1e1e" stroke-width="1.6" marker-end="url(#arr)">
    <path d="M232,220 L250,262"/>
    <path d="M147,306 L147,316"/>
    <path d="M235,334 L255,318"/>
    <path d="M235,384 L255,405"/>
    <path d="M235,438 L255,428"/>
    <path d="M334,368 L334,386"/>
    <path d="M410,418 L450,390"/>
    <path d="M520,322 L620,244"/>
    <path d="M735,244 L620,326"/>
    <path d="M668,372 L870,385"/>
    <path d="M1032,385 L1050,382"/>
    <path d="M1032,300 L1080,352"/>
    <path d="M1180,370 L1253,385"/>
    <!-- memory -> working memory -->
    <path d="M160,568 L300,452"/>
    <path d="M385,568 L330,452"/>
    <path d="M610,568 L370,452"/>
    <path d="M850,568 L405,450"/>
    <!-- db -> stores -->
    <path d="M455,758 L400,698"/>
    <path d="M495,758 L580,698"/>
    <path d="M880,758 L860,698"/>
    <!-- save + consolidate -->
    <path d="M1100,408 L925,782"/>
    <path d="M880,862 L880,888"/>
    <path d="M880,990 L880,1003"/>
    <path d="M760,1040 L505,858"/>
    <!-- llm ops -->
    <path d="M1455,385 L1476,385"/>
    <path d="M1620,532 L1620,556"/>
    <path d="M1620,625 L1620,638"/>
    <path d="M1620,770 L1620,808"/>
    <path d="M1500,690 L1380,438"/>
    <path d="M1490,850 L1185,470"/>
  </g>

  <!-- ============ text ============ -->
  <g>
    <text x="50" y="68" font-size="34" fill="#c92a2a">Harness</text>
    <text x="50" y="96" font-size="16" fill="#c92a2a">hand-written on the anthropic SDK (app/agent.py)</text>
    <text x="50" y="117" font-size="16" fill="#c92a2a">no LangGraph / LangChain</text>
    <text x="450" y="140" font-size="32" fill="#e8890c">Loop</text>
    <text x="1255" y="312" font-size="32" fill="#1c5bb8">LLM Ops</text>

    <text x="72" y="164" font-size="15">Auth: Streamlit login → signed JWT</text>
    <text x="72" y="185" font-size="14">role: employee / manager / hr_admin</text>
    <text x="72" y="206" font-size="14">filters tools + docs; MCP server re-checks</text>

    <text x="55" y="246" font-size="15">One chat turn: everything in this box is rebuilt per question</text>

    <text x="147" y="293" text-anchor="middle">User prompt</text>
    <text x="147" y="341" text-anchor="middle" font-size="14">PII masking (Presidio)</text>
    <text x="147" y="389" text-anchor="middle" font-size="14">Chat history (last 10)</text>
    <text x="147" y="435" text-anchor="middle" font-size="14">System prompt v3</text>
    <text x="147" y="454" text-anchor="middle" font-size="13">(stable, prompt-cached)</text>

    <text x="334" y="288" text-anchor="middle" font-size="14">Triage, in parallel</text>
    <text x="334" y="308" text-anchor="middle" font-size="13">classifier (Haiku)</text>
    <text x="334" y="326" text-anchor="middle" font-size="13">router (Haiku):</text>
    <text x="334" y="343" text-anchor="middle" font-size="13">faq / simple / complex</text>
    <text x="334" y="361" text-anchor="middle" font-size="12" fill="#c92a2a">blocked → safe reply</text>

    <text x="334" y="413" text-anchor="middle" font-size="14">Working memory</text>
    <text x="334" y="433" text-anchor="middle" font-size="14">/ context (RAM)</text>

    <text x="711" y="131" text-anchor="middle" font-size="15">MCP tools (FastMCP, stdio)</text>
    <text x="598" y="155" font-size="13">- leave: balance / apply / approve</text>
    <text x="598" y="175" font-size="13">- payslip, onboarding tasks</text>
    <text x="598" y="195" font-size="13">- book HR meeting, search staff</text>
    <text x="598" y="215" font-size="13">- JWT checked in every tool</text>
    <text x="598" y="233" font-size="13">→ hr.db (SQLite)</text>

    <text x="545" y="272" font-size="13" text-anchor="end">tool_use</text>
    <text x="700" y="272" font-size="13">tool_result</text>

    <text x="560" y="358" text-anchor="middle" font-size="16">LLM agent</text>
    <text x="560" y="378" text-anchor="middle" font-size="13">Haiku 5.5: faq, simple</text>
    <text x="560" y="396" text-anchor="middle" font-size="13">Sonnet 5.5: complex</text>

    <text x="952" y="290" text-anchor="middle" font-size="14">Answer cache (faq)</text>
    <text x="952" y="308" text-anchor="middle" font-size="12">similarity ≥ 0.80</text>
    <text x="952" y="323" text-anchor="middle" font-size="12">+ Haiku "same question?"</text>
    <text x="1072" y="318" font-size="12">hit</text>

    <text x="952" y="372" text-anchor="middle" font-size="14">End-loop guardrails</text>
    <text x="952" y="391" text-anchor="middle" font-size="12">PII masking +</text>
    <text x="952" y="407" text-anchor="middle" font-size="12">groundedness (Haiku) → ⚠️</text>

    <text x="1108" y="386" text-anchor="middle" font-size="17">Reply</text>

    <!-- memory labels -->
    <text x="62" y="545" font-size="13">skills (keyword match)</text>
    <text x="378" y="535" font-size="13">RAG top-4</text>
    <text x="468" y="548" font-size="13">facts + profile</text>
    <text x="640" y="508" font-size="13">recent episodes</text>

    <text x="157" y="595" text-anchor="middle" font-size="15">Procedural memory</text>
    <text x="68" y="618" font-size="13">(files: skills/*.md)</text>
    <text x="68" y="638" font-size="13">- how to act, step by step</text>
    <text x="68" y="658" font-size="13">- leave, expenses, payslip,</text>
    <text x="68" y="676" font-size="13">  onboarding</text>

    <text x="387" y="595" text-anchor="middle" font-size="15">Company docs (RAG)</text>
    <text x="292" y="618" font-size="13">- 7 policies, chunk per ##</text>
    <text x="292" y="638" font-size="13">- top-4, score ≥ 0.25</text>
    <text x="292" y="658" font-size="13">- role filter in the query</text>
    <text x="292" y="678" font-size="13">  (payroll.md: HR only)</text>

    <text x="615" y="595" text-anchor="middle" font-size="15">Semantic memory</text>
    <text x="527" y="618" font-size="13">(vector store + SQLite)</text>
    <text x="527" y="638" font-size="13">- durable facts (top 5)</text>
    <text x="527" y="658" font-size="13">- user profile</text>

    <text x="852" y="595" text-anchor="middle" font-size="15">Episodic memory</text>
    <text x="748" y="618" font-size="13">(SQLite)</text>
    <text x="748" y="638" font-size="13">- dated Q&amp;A episodes</text>
    <text x="748" y="658" font-size="13">- last 3 from other sessions</text>
    <text x="748" y="678" font-size="13">- labelled "may be outdated"</text>

    <text x="472" y="890" text-anchor="middle" font-size="14">Chroma (.chroma)</text>
    <text x="472" y="908" text-anchor="middle" font-size="12">docs, facts, answer cache</text>
    <text x="960" y="840" font-size="14">memory.db</text>

    <text x="1030" y="600" font-size="14">save the turn</text>

    <text x="880" y="936" text-anchor="middle" font-size="14">Only consolidate after</text>
    <text x="880" y="955" text-anchor="middle" font-size="14">3 new chats</text>

    <text x="880" y="1040" text-anchor="middle" font-size="15">Summarizer agent (Haiku)</text>
    <text x="880" y="1060" text-anchor="middle" font-size="12">never stores live HR state</text>

    <text x="545" y="975" font-size="14">distill into facts</text>

    <!-- llm ops -->
        <text x="1355" y="368" text-anchor="middle" font-size="15" fill="#1c5bb8">Trace</text>
    <text x="1355" y="390" text-anchor="middle" font-size="13">1 trace per turn</text>
    <text x="1355" y="410" text-anchor="middle" font-size="13">OpenTelemetry → Phoenix</text>
    <text x="1355" y="428" text-anchor="middle" font-size="12">tokens + cost per span</text>

    <text x="1620" y="370" text-anchor="middle" font-size="15" fill="#1c5bb8">Eval (was it good?)</text>
    <text x="1620" y="392" text-anchor="middle" font-size="13">37 golden cases: regex checks</text>
    <text x="1620" y="412" text-anchor="middle" font-size="13">+ Sonnet judge (yes / no)</text>

    <text x="1620" y="462" text-anchor="middle" font-size="15" fill="#1c5bb8">Observe (was it healthy?)</text>
    <text x="1620" y="484" text-anchor="middle" font-size="13">tokens, latency, cost,</text>
    <text x="1620" y="504" text-anchor="middle" font-size="13">cache hits, errors</text>

    <text x="1620" y="582" text-anchor="middle" font-size="15" fill="#1c5bb8">Diagnose</text>
    <text x="1620" y="604" text-anchor="middle" font-size="13">report.md + trace id per case</text>

    <text x="1620" y="683" text-anchor="middle" font-size="16">Gate</text>
    <text x="1620" y="703" text-anchor="middle" font-size="12">≥ 80% pass, 0 leaks,</text>
    <text x="1620" y="720" text-anchor="middle" font-size="12">0 false blocks,</text>
    <text x="1620" y="737" text-anchor="middle" font-size="12">no regressions (2 of 3)</text>

    <text x="1630" y="792" font-size="13">passed</text>

    <text x="1620" y="832" text-anchor="middle" font-size="15" fill="#1c5bb8">Release</text>
    <text x="1620" y="854" text-anchor="middle" font-size="13">--release sets prompt_version</text>
    <text x="1620" y="874" text-anchor="middle" font-size="13">in config.yaml</text>
    <text x="1620" y="894" text-anchor="middle" font-size="13">(prompt, model, top-k, thresholds)</text>

    <text x="1300" y="555" font-size="13">not passed:</text>
    <text x="1300" y="573" font-size="13">fix, re-run, re-eval</text>

    <text x="1245" y="760" font-size="13">improved system prompt</text>
    <text x="1245" y="778" font-size="13">+ config</text>
  </g>
</svg>
