# Central settings. Changing anything here is a "release" that should pass evals (milestone 9).

# Which system prompt file to load: prompts/system_<prompt_version>.md
prompt_version: v1

# Model tiers. The router (milestone 7) picks a tier per request; until then everything is "cheap".
models:
  cheap:                       # classification, guardrails, summaries, simple FAQ answers
    id: claude-haiku-5-5
    effort: low
    max_tokens: 4000
    usd_per_mtok: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  smart:                       # multi-step, tool-heavy requests and the eval judge
    id: claude-sonnet-5-5
    effort: medium
    max_tokens: 16000
    usd_per_mtok: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}

default_tier: cheap

# Routing (milestone 7): a Haiku call picks a route; each route maps to a model tier.
routing:
  enabled: true
  tiers: {faq: cheap, simple: cheap, complex: smart}

# Semantic answer cache (milestone 7): reuse answers to repeated policy FAQs.
answer_cache:
  enabled: true
  # Embeddings can't separate near-misses: "primary" vs "secondary caregiver" scored 0.974,
  # higher than real paraphrases (0.81-0.89). So similarity only finds a candidate, and a
  # tiny Haiku check confirms the two questions really ask the same thing.
  min_similarity: 0.80
  verify_with_llm: true
  ttl_hours: 24

# Retrieval (milestone 2)
rag:
  chroma_path: .chroma         # local vector store, git-ignored; rebuild with `python -m app.rag ingest`
  top_k: 4                     # chunks retrieved per question
  min_score: 0.25              # cosine similarity cut-off; weaker matches are dropped

# Agent loop (milestone 4)
agent:
  max_tool_rounds: 6           # safety stop: model calls per turn before giving up

# Guardrails (milestone 6)
guardrails:
  pii_entities: [CREDIT_CARD, IBAN_CODE, US_SSN, US_PASSPORT, CRYPTO, PASSWORD]  # masked in input and output
  pii_min_score: 0.5           # Presidio confidence cut-off (drops weak guesses like 0.4 "driver licence")
  classify_input: true         # Haiku injection / off-topic screen before the agent loop
  check_groundedness: true     # Haiku judge after the loop; flags answers not backed by docs or tools
  judge_effort: medium         # judging needs more reasoning than chatting; "low" gave false alarms

# Harness memory (milestone 3)
memory:
  db_path: data/memory.db      # episodic memory + user profiles (SQLite, git-ignored)
  history_window: 10           # working memory: last N chat messages sent verbatim
  recent_episodes: 3           # episodic: past Q&A pairs from earlier sessions
  facts_top_k: 5               # semantic: long-term facts retrieved per question
  consolidate_every_n: 3       # summarizer runs once this many episodes are unconsolidated
